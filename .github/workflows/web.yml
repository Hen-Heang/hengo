name: Web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The task mutation suite rejects non-local URLs even though it replaces
  # the Supabase client with an in-memory fake.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
  OPENAI_API_KEY: sk-placeholder-ci-key
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder.apps.googleusercontent.com
  NEXT_PUBLIC_VAPID_KEY: placeholder-vapid-key

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: ESLint
        run: pnpm lint:web

      - name: Prettier check
        run: pnpm format:web:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Test
        run: pnpm test:web

  build:
    name: Build Verification
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Build
        run: pnpm build:web

  quality-gate:
    name: Quality Gate
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "✅ Lint, tests, and build all passed — safe to merge!"
