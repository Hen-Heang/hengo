name: Format Core Korean PR

on:
  push:
    branches:
      - feat/core-korean-300

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-korean-300

      - uses: ./.github/actions/setup-web

      - name: Format Core Korean files
        run: |
          pnpm --dir apps/web exec prettier --write \
            components/vocab/CoreKoreanPanel.tsx \
            docs/core-korean-300.md \
            lib/api/core-korean.ts \
            lib/core-korean-vocab.ts

      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/format-core-korean-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/vocab/CoreKoreanPanel.tsx \
            apps/web/docs/core-korean-300.md \
            apps/web/lib/api/core-korean.ts \
            apps/web/lib/core-korean-vocab.ts \
            .github/workflows/format-core-korean-pr.yml
          git commit -m "style(vocab): format Core Korean files"
          git push origin HEAD:feat/core-korean-300
